# ── Додати в блок server { } конфігу /etc/nginx/sites-available/default ──

# 1. Змінні панелі — дописати в НАЯВНИЙ блок location ~ ^/api/.+\.php$
#    (там, де вже лежать GA4_API_SECRET і TELEGRAM_BOT_TOKEN):
#
#      fastcgi_param ADMIN_USER          "admin";
#      fastcgi_param ADMIN_PASSWORD_HASH "СЮДИ_ХЕШ_ПАРОЛЯ";
#
#    Окремий location для /api/admin не потрібен: панель звертається
#    до /api/admin.php, а цей шлях уже обробляє наявне правило.

# 2. Статика панелі — додати новий блок:

location /admin {
    alias /var/www/html/admin;
    index index.html;
    try_files $uri $uri/ /admin/index.html;

    # Панель не має потрапляти в пошук.
    add_header X-Robots-Tag "noindex, nofollow" always;
}
