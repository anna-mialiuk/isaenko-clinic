name: Deploy Isaenko Clinic

on:
  push:
    branches:
      - main

concurrency:
  group: isaenko-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check project
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload build
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "rm -rf /tmp/isaenko-deploy && mkdir -p /tmp/isaenko-deploy"

          scp -i ~/.ssh/deploy_key -P "$SSH_PORT" -r dist/. \
            "$SSH_USER@$SSH_HOST:/tmp/isaenko-deploy/"

      - name: Publish website
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" '
            set -e
            test -f /tmp/isaenko-deploy/index.html
            rm -rf /var/www/html/*
            cp -a /tmp/isaenko-deploy/. /var/www/html/
            rm -rf /tmp/isaenko-deploy
            echo "Deployment completed"
          '
